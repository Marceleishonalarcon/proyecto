<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión de Tienda</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Sidebar de Navegación -->
    <nav id="main-nav">
        <h1>Gestión de Tienda</h1>
        <div class="nav-links">
            <button class="nav-btn active" data-target="inventario">📦 Inventario</button>
            <button class="nav-btn" data-target="ventas">🛒 Punto de Venta</button>
        </div>
    </nav>

    <main>
        <!-- SECCIÓN INVENTARIO -->
        <section id="inventario" class="section active">
            <div class="card">
                <h2>Registrar Prenda</h2>
                <div id="inv-alert" class="alert hidden"></div>
                <form id="form-producto">
                    <div class="form-group">
                        <label for="p-codigo">Código del producto * (6 dígitos)</label>
                        <input type="text" id="p-codigo" required placeholder="ABC-123" maxlength="7">
                    </div>
                    <div class="form-group">
                        <label for="p-nombre">Nombre de la prenda * (Solo letras)</label>
                        <input type="text" id="p-nombre" required placeholder="Ej: Camisa Polo">
                    </div>
                    
                    <div class="form-group tallas-container">
                        <label>Tallas y Stock * (Deje en 0 las que no apliquen)</label>
                        <div class="tallas-grid">
                            <div class="talla-item">
                                <label for="stock-xs">XS</label>
                                <input type="number" id="stock-xs" class="stock-input" data-talla="XS" min="0" placeholder="0">
                            </div>
                            <div class="talla-item">
                                <label for="stock-s">S</label>
                                <input type="number" id="stock-s" class="stock-input" data-talla="S" min="0" placeholder="0">
                            </div>
                            <div class="talla-item">
                                <label for="stock-m">M</label>
                                <input type="number" id="stock-m" class="stock-input" data-talla="M" min="0" placeholder="0">
                            </div>
                            <div class="talla-item">
                                <label for="stock-l">L</label>
                                <input type="number" id="stock-l" class="stock-input" data-talla="L" min="0" placeholder="0">
                            </div>
                            <div class="talla-item">
                                <label for="stock-xl">XL</label>
                                <input type="number" id="stock-xl" class="stock-input" data-talla="XL" min="0" placeholder="0">
                            </div>
                            <div class="talla-item">
                                <label for="stock-xxl">XXL</label>
                                <input type="number" id="stock-xxl" class="stock-input" data-talla="XXL" min="0" placeholder="0">
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="p-precio">Precio * (Valores positivos)</label>
                        <input type="number" id="p-precio" step="0.01" min="0.01" required placeholder="0.00">
                    </div>
                    
                    <button type="submit" class="btn-submit">Guardar Producto</button>
                </form>
            </div>

            <div class="card">
                <h2>Catálogo de Productos</h2>
                <div class="search-bar">
                    <label for="p-buscar" class="sr-only">Buscar producto</label>
                    <input type="text" id="p-buscar" placeholder="Buscar por nombre o talla...">
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Nombre</th>
                                <th>Tallas</th>
                                <th>Precio</th>
                                <th>Stock Total</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-productos">
                            <!-- JS inyecta filas aquí -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- SECCIÓN VENTAS -->
        <section id="ventas" class="section">
            <div class="card">
                <h2>Realizar Venta</h2>
                <div id="ven-alert" class="alert hidden"></div>
                <form id="form-venta">
                    <div class="form-group">
                        <label for="v-codigo">Seleccionar Producto *</label>
                        <select id="v-codigo" required>
                            <option value="">-- Seleccione un producto --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="v-talla">Seleccionar Talla *</label>
                        <select id="v-talla" required disabled>
                            <option value="">-- Seleccione producto primero --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="v-cantidad">Cantidad a vender * (Enteros > 0)</label>
                        <input type="number" id="v-cantidad" step="1" min="1" required placeholder="1">
                    </div>
                    <button type="submit" class="btn-submit btn-sell">Procesar Venta</button>
                </form>
            </div>

            <div class="card">
                <h2>Disponibilidad en Tiempo Real</h2>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Nombre</th>
                                <th>Tallas Disponibles</th>
                                <th>Stock Total</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-disponibilidad">
                            <!-- JS inyecta filas aquí -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
